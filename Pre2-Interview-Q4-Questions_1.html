<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英検準2級 面接対策 大問4 #1</title>
<script src="auth.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Andika&family=Kosugi+Maru&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f6f8;
            --main-text: #2c3e50;
            --box-bg: #ffffff;
            --accent-blue: #2980b9;
            --btn-yes: #2ecc71;
            --btn-no: #e74c3c;
            --btn-hover-yes: #27ae60;
            --btn-hover-no: #c0392b;
            --border-color: #dcdde1;
        }

        body {
            font-family: 'Andika', 'Kosugi Maru', sans-serif;
            background-color: var(--bg-color);
            color: var(--main-text);
            margin: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: var(--box-bg);
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 4px solid #dee2e6;
            box-sizing: border-box;
            text-align: center;
        }

        h1 {
            font-size: 22px;
            color: var(--accent-blue);
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 2px dashed var(--accent-blue);
            padding-bottom: 12px;
        }

        .progress {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 20px;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 25px;
        }

        .icon-btn {
            background: #f8f9fa;
            border: 2px solid var(--border-color);
            border-radius: 50%;
            width: 70px;
            height: 70px;
            font-size: 32px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .icon-btn:hover {
            transform: scale(1.08);
            background: #e9ecef;
        }

        .question-text {
            font-size: 24px;
            font-weight: bold;
            color: #1a252f;
            line-height: 1.5;
            margin: 25px 0;
            min-height: 80px;
            display: none;
            padding: 15px;
            background: #fdfefe;
            border-radius: 12px;
            border: 1px solid #f1f2f6;
        }

        .stance-container {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin: 30px 0;
        }

        .stance-btn {
            border: none;
            border-radius: 16px;
            padding: 15px 35px;
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            min-width: 180px;
        }

        .btn-y { background-color: var(--btn-yes); }
        .btn-y:hover { background-color: var(--btn-hover-yes); transform: translateY(-2px); }
        .btn-n { background-color: var(--btn-no); }
        .btn-n:hover { background-color: var(--btn-hover-no); transform: translateY(-2px); }

        .interviewer-follow {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent-blue);
            margin: 25px 0;
            min-height: 40px;
            display: none;
            font-style: italic;
        }

        .model-answers-section {
            display: none;
            text-align: left;
            margin-top: 35px;
            padding-top: 25px;
            border-top: 3px double var(--border-color);
        }

        .model-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            color: #2c3e50;
        }

        .answer-block {
            margin-bottom: 25px;
            padding: 15px 20px;
            border-radius: 14px;
        }

        .yes-block {
            background-color: #e8f8f5;
            border-left: 6px solid var(--btn-yes);
        }

        .no-block {
            background-color: #fdebd0;
            border-left: 6px solid var(--btn-no);
        }

        .block-header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .answer-item {
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px dashed rgba(0,0,0,0.08);
        }
        .answer-item:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .step-label {
            font-size: 14px;
            font-weight: bold;
            color: #7f8c8d;
            margin-top: 4px;
        }

        .jp-sub {
            font-size: 15px;
            color: #5d6d7e;
            margin-top: 4px;
            font-weight: normal;
        }

        .nav-btn {
            background-color: #34495e;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px 45px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 25px;
            transition: background 0.2s;
        }

        .nav-btn:hover { background-color: #2c3e50; }

        .result-screen {
            display: none;
        }

        .print-only {
            display: none;
        }

        @media print {
            body {
                background: #fff !important;
                color: #000 !important;
                padding: 0 !important;
                margin: 0 !important;
                font-family: Arial, sans-serif, 'Kosugi Maru';
            }

            .container, #quiz-screen, #result-screen {
                display: none !important;
            }

            .print-only {
                display: block !important;
                width: 100%;
                padding: 5mm 10mm;
                box-sizing: border-box;
            }

            .print-title {
                font-size: 16pt;
                font-weight: bold;
                text-align: center;
                margin-bottom: 20px;
                border-bottom: 2px solid #333;
                padding-bottom: 8px;
            }

            .print-item {
                margin-bottom: 22px;
                page-break-inside: avoid;
            }

            .print-q-header {
                font-size: 11pt;
                font-weight: bold;
                color: #2c3e50;
                margin-bottom: 4px;
            }

            .print-q-body {
                font-size: 11.5pt;
                line-height: 1.4;
                margin-bottom: 8px;
            }

            .worksheet-box {
                margin-top: 6px;
            }

            .worksheet-title {
                font-size: 9.5pt;
                font-weight: bold;
                color: #444;
                margin-bottom: 6px;
            }

            .write-line {
                border-bottom: 1px solid #777;
                height: 28px;
                margin-bottom: 4px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="quiz-screen">
        <h1>英検準2級 面接対策 大問4 #1 (社会問題・意見編)</h1>
        <div class="progress" id="progress">Question 1 / --</div>
        
        <div class="action-buttons">
            <button class="icon-btn" onclick="speakQuestion()" title="質問を聴く">🔊</button>
            <button class="icon-btn" onclick="toggleQuestionText()" title="質問を見る">👁️</button>
        </div>

        <div class="question-text" id="question-display">---</div>

        <div class="stance-container" id="stance-area">
            <button class="stance-btn btn-y" id="btn-agree" onclick="selectStance('yes')">Yes, I do.</button>
            <button class="stance-btn btn-n" id="btn-disagree" onclick="selectStance('no')">No, I don't.</button>
        </div>

        <div class="interviewer-follow" id="follow-text">---</div>

        <button class="nav-btn" id="next-stage-btn" style="display: none;" onclick="showModelAnswers()">NEXT (模範解答を見る) ➔</button>

        <div class="model-answers-section" id="answers-section">
            <div class="model-title">💡 模範解答 (Why / Why not への理由回答)</div>
            
            <div class="answer-block yes-block">
                <div class="block-header" style="color:#27ae60;">🟢 賛成 (Yes / I agree) の解答例</div>
                <div id="yes-answers-list"></div>
            </div>

            <div class="answer-block no-block">
                <div class="block-header" style="color:#c0392b;">🔴 反対 (No / I disagree) の解答例</div>
                <div id="no-answers-list"></div>
            </div>

            <div style="text-align: center;">
                <button class="nav-btn" style="background-color:var(--accent-blue);" onclick="nextQuestion()">次の質問へ進む ➔</button>
            </div>
        </div>

    </div>

    <div class="result-screen" id="result-screen">
        <div class="model-title" style="font-size: 32px;">🎉 特訓完了！ 🎉</div>
        <p style="font-size: 20px; line-height: 1.6;">社会的なテーマに対して理由（2文程度）を<br>ハッキリ答える練習を何度も繰り返しましょう！</p>
        <button class="nav-btn" style="background-color:var(--accent-blue);" onclick="resetQuiz()">もう一度最初から解く</button>
    </div>
</div>

<!-- ワークシート印刷用エリア -->
<div class="print-only" id="print-area">
    <div class="print-title">英検準2級 面接対策 大問4 #1 ワークシート</div>
    <div id="print-content"></div>
</div>

<script>
const quizData = [
    {
        category: "日常生活・習慣（電動自転車）",
        q: "These days, many people use electric bicycles. Do you think more people will ride electric bicycles in the future?",
        yes: [
            { basic: "Because electric bicycles are very convenient, especially when going uphill. Also, they are good for the environment.", adv: "Because electric bicycles make traveling long distances much easier. They are also a green choice for reducing emissions.", jp: "【基本】電動自転車は特に坂道を上る時にとても便利だからです。また、環境にも良いです。【準2級】電動自転車は長距離の移動をずっと楽にしてくれるからです。排出量を減らす環境に優しい選択肢でもあります。" }
        ],
        no: [
            { basic: "Because electric bicycles are expensive to buy. Also, many people prefer walking or taking the bus.", adv: "Because purchasing electric bikes requires a lot of money. Many people prefer traditional bikes or public transport.", jp: "【基本】電動自転車は買うのが高いからです。また、多くの人は歩いたりバスに乗ったりする方を好みます。【準2級】電動自転車の購入には多額のお金がかかるからです。普通の自転車や公共交通機関を好む人が多いです。" }
        ]
    },
    {
        category: "テクノロジー・環境（電子書籍）",
        q: "Today, many people read books or news on smartphones or e-readers. Do you think paper books will disappear in the future?",
        yes: [
            { basic: "Because e-books are easy to carry and take up no space at home. Also, people can buy and read them anytime.", adv: "Because digital books offer convenience and save physical storage space. Readers can instantly purchase and download them.", jp: "【基本】電子書籍は持ち運びが簡単で家で場所をとらないからです。また、いつでも買って読むことができます。【準2級】デジタル本は便利で物理的な収納スペースを節約できるからです。読者は瞬時に購入してダウンロードできます。" }
        ],
        no: [
            { basic: "Because many people like the feeling of reading real paper books. Also, reading paper books is easier on the eyes than looking at screens.", adv: "Because people enjoy the physical sensation of turning real pages. Reading physical books reduces eye strain from digital screens.", jp: "【基本】多くの人は本物の紙の本を読む感覚が好きだからです。また、画面を見るより紙の本を読む方が目に優しいです。【準2級】実際のページをめくる触覚的な感覚を楽しむ人が多いからです。実物の本を読む方が画面による目の疲労を軽減できます。" }
        ]
    },
    {
        category: "教育・働き方（タブレット学習）",
        q: "These days, many schools introduce tablets or laptops in classes. Do you think using digital devices in class is good for students?",
        yes: [
            { basic: "Because digital devices make lessons more interesting and interactive. Also, students can search for information quickly.", adv: "Because technology encourages interactive learning and student participation. It enables students to access vast online information.", jp: "【基本】デジタル機器は授業をより面白く双方向にさせてくれるからです。また、生徒は情報を素早く検索できます。【準2級】テクノロジーはインタラクティブな学習と生徒の参加を促進するからです。膨大なオンライン情報にアクセスできるようになります。" }
        ],
        no: [
            { basic: "Because looking at screens for a long time can damage students' eyes. Also, students might play games or check social media during class.", adv: "Because extended screen time negatively affects students' eyesight. Digital devices can also easily distract students from studying.", jp: "【基本】長い時間画面を見ていると生徒の目を痛める可能性があるからです。また、授業中にゲームをしたりSNSを見たりするかもしれません。【準2級】長時間の画面視聴は生徒の視力に悪影響を与えるからです。デジタル機器は授業からの気を散らす原因にもなりやすいです。" }
        ]
    },
    {
        category: "趣味・旅行（SNS投稿）",
        q: "These days, many people take photos of their meals or trips and post them on social media. Do you think this is a good habit?",
        yes: [
            { basic: "Because it helps people keep good memories of their daily life. Also, they can share enjoyable moments with friends.", adv: "Because sharing daily experiences strengthens personal connections with friends. It serves as a digital diary of special memories.", jp: "【基本】日常生活の素晴らしい思い出を残すのに役立つからです。また、友人たちと楽しい瞬間を共有できます。【準2級】日常の体験を共有することで友人との繋がりが深まるからです。特別な思い出のデジタル日記として機能します。" }
        ],
        no: [
            { basic: "Because spending too much time taking photos can ruin the enjoyment of the moment. Also, it can cause privacy issues.", adv: "Because focusing on pictures prevents people from fully enjoying the real experience. Posting private details can lead to safety risks.", jp: "【基本】写真を撮るのに時間をかけすぎるとその場の楽しみが台無しになるからです。また、プライバシー問題を引き起こすこともあります。【準2級】写真に集中すると実際の体験を心から楽しめなくなるからです。個人的な詳細を投稿することは安全上のリスクにつながります。" }
        ]
    },
    {
        category: "日常生活・環境（カフェでの作業）",
        q: "These days, some people choose to work or study in coffee shops. Do you think this is a good idea?",
        yes: [
            { basic: "Because coffee shops are quiet and comfortable, so people can concentrate well. Also, they can enjoy delicious drinks while working.", adv: "Because a fresh environment helps boost productivity and focus. People can also enjoy quality coffee while working comfortably.", jp: "【基本】カフェは静かで快適なのでとても集中できるからです。また、働きながら美味しい飲み物を楽しめます。【準2級】環境を変えることで生産性と集中力が高まるからです。快適に作業しながら質の高いコーヒーも楽しめます。" }
        ],
        no: [
            { basic: "Because coffee shops can be noisy when there are many customers. Also, buying drinks every time costs a lot of money.", adv: "Because noisy environments in crowded cafes make it hard to focus. Buying beverages frequently can become expensive.", jp: "【基本】客が多いとカフェの中がうるさくなる可能性があるからです。また、毎回飲み物を買うと多くのお金がかかります。【準2級】混雑したカフェの騒々しい環境では集中しづらいからです。頻繁に飲み物を購入するとコストがかさみます。" }
        ]
    }
];

let shuffledQuiz = [];
let currentIdx = 0;

function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

function initQuiz() {
    shuffledQuiz = shuffleArray([...quizData]);
    currentIdx = 0;
    loadQuestion();
    renderPrintContent();
}

function renderPrintContent() {
    const printContent = document.getElementById("print-content");
    printContent.innerHTML = "";

    quizData.forEach((item, index) => {
        const itemDiv = document.createElement("div");
        itemDiv.className = "print-item";

        let html = `
        <div class="print-q-header">Q${index + 1}. [${item.category}]</div>
        <div class="print-q-body">${item.q}</div>
        <div class="worksheet-box">
            <div class="worksheet-title">My Answer (自分の意見を書いてみよう)</div>
            <div class="write-line"></div>
            <div class="write-line"></div>
            <div class="write-line"></div>
        </div>`;

        itemDiv.innerHTML = html;
        printContent.appendChild(itemDiv);
    });
}

function loadQuestion() {
    const data = shuffledQuiz[currentIdx];
    document.getElementById("progress").innerText = `Question ${currentIdx + 1} / ${shuffledQuiz.length}`;
    
    const qDisplay = document.getElementById("question-display");
    qDisplay.innerText = data.q;
    qDisplay.style.display = "none";

    const stanceArea = document.getElementById("stance-area");
    stanceArea.style.display = "flex";

    document.getElementById("btn-agree").innerText = "Yes, I do.";
    document.getElementById("btn-disagree").innerText = "No, I don't.";
    
    const followText = document.getElementById("follow-text");
    followText.innerText = "";
    followText.style.display = "none";

    document.getElementById("next-stage-btn").style.display = "none";
    document.getElementById("answers-section").style.display = "none";
}

function speakQuestion() {
    const text = shuffledQuiz[currentIdx].q;
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
    } else {
        alert("お使いのブラウザは音声読み上げに対応していません。");
    }
}

function toggleQuestionText() {
    const qDisplay = document.getElementById("question-display");
    qDisplay.style.display = (qDisplay.style.display === "none") ? "block" : "none";
}

function selectStance(choice) {
    const followText = document.getElementById("follow-text");
    followText.style.display = "block";
    
    if (choice === 'yes') {
        followText.innerText = "🗣️ \"Why?\"";
    } else {
        followText.innerText = "🗣️ \"Why not?\"";
    }

    document.getElementById("stance-area").style.display = "none";
    document.getElementById("next-stage-btn").style.display = "inline-block";
}

function showModelAnswers() {
    const data = shuffledQuiz[currentIdx];
    document.getElementById("next-stage-btn").style.display = "none";
    
    const listYes = document.getElementById("yes-answers-list");
    const listNo = document.getElementById("no-answers-list");
    
    listYes.innerHTML = "";
    listNo.innerHTML = "";

    data.yes.forEach((item) => {
        const div = document.createElement("div");
        div.className = "answer-item";
        div.innerHTML = `
            <div class="step-label">🟢 基本表現 (3級・確実):</div> ${item.basic}<br>
            <div class="step-label" style="color:#2980b9;">🔵 準2級表現 (語彙強化):</div> ${item.adv}
            <div class="jp-sub">${item.jp}</div>
        `;
        listYes.appendChild(div);
    });

    data.no.forEach((item) => {
        const div = document.createElement("div");
        div.className = "answer-item";
        div.innerHTML = `
            <div class="step-label">🔴 基本表現 (3級・確実):</div> ${item.basic}<br>
            <div class="step-label" style="color:#2980b9;">🔵 準2級表現 (語彙強化):</div> ${item.adv}
            <div class="jp-sub">${item.jp}</div>
        `;
        listNo.appendChild(div);
    });

    document.getElementById("answers-section").style.display = "block";
}

function nextQuestion() {
    currentIdx++;
    if (currentIdx < shuffledQuiz.length) {
        loadQuestion();
    } else {
        document.getElementById("quiz-screen").style.display = "none";
        document.getElementById("result-screen").style.display = "block";
    }
}

function resetQuiz() {
    document.getElementById("quiz-screen").style.display = "block";
    document.getElementById("result-screen").style.display = "none";
    initQuiz();
}

initQuiz();
</script>

</body>
</html>
