<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英検準2級 面接対策 大問4 #4</title>
<script src="auth.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Andika&family=Kosugi+Maru&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f6f8;
            --main-text: #2c3e50;
            --box-bg: #ffffff;
            --accent-blue: #2980b9;
            --btn-yes: #2ecc71;
            --btn-no: #e74c3c;
            --btn-hover-yes: #27ae60;
            --btn-hover-no: #c0392b;
            --border-color: #dcdde1;
        }

        body {
            font-family: 'Andika', 'Kosugi Maru', sans-serif;
            background-color: var(--bg-color);
            color: var(--main-text);
            margin: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: var(--box-bg);
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 4px solid #dee2e6;
            box-sizing: border-box;
            text-align: center;
        }

        h1 {
            font-size: 22px;
            color: var(--accent-blue);
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 2px dashed var(--accent-blue);
            padding-bottom: 12px;
        }

        .progress {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 20px;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 25px;
        }

        .icon-btn {
            background: #f8f9fa;
            border: 2px solid var(--border-color);
            border-radius: 50%;
            width: 70px;
            height: 70px;
            font-size: 32px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .icon-btn:hover {
            transform: scale(1.08);
            background: #e9ecef;
        }

        .question-text {
            font-size: 24px;
            font-weight: bold;
            color: #1a252f;
            line-height: 1.5;
            margin: 25px 0;
            min-height: 80px;
            display: none;
            padding: 15px;
            background: #fdfefe;
            border-radius: 12px;
            border: 1px solid #f1f2f6;
        }

        .stance-container {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin: 30px 0;
        }

        .stance-btn {
            border: none;
            border-radius: 16px;
            padding: 15px 35px;
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            min-width: 180px;
        }

        .btn-y { background-color: var(--btn-yes); }
        .btn-y:hover { background-color: var(--btn-hover-yes); transform: translateY(-2px); }
        .btn-n { background-color: var(--btn-no); }
        .btn-n:hover { background-color: var(--btn-hover-no); transform: translateY(-2px); }

        .interviewer-follow {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent-blue);
            margin: 25px 0;
            min-height: 40px;
            display: none;
            font-style: italic;
        }

        .model-answers-section {
            display: none;
            text-align: left;
            margin-top: 35px;
            padding-top: 25px;
            border-top: 3px double var(--border-color);
        }

        .model-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            color: #2c3e50;
        }

        .answer-block {
            margin-bottom: 25px;
            padding: 15px 20px;
            border-radius: 14px;
        }

        .yes-block {
            background-color: #e8f8f5;
            border-left: 6px solid var(--btn-yes);
        }

        .no-block {
            background-color: #fdebd0;
            border-left: 6px solid var(--btn-no);
        }

        .block-header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .answer-item {
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px dashed rgba(0,0,0,0.08);
        }
        .answer-item:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .step-label {
            font-size: 14px;
            font-weight: bold;
            color: #7f8c8d;
            margin-top: 4px;
        }

        .jp-sub {
            font-size: 15px;
            color: #5d6d7e;
            margin-top: 4px;
            font-weight: normal;
        }

        .nav-btn {
            background-color: #34495e;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px 45px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 25px;
            transition: background 0.2s;
        }

        .nav-btn:hover { background-color: #2c3e50; }

        .result-screen {
            display: none;
        }

        .print-only {
            display: none;
        }

        @media print {
            body {
                background: #fff !important;
                color: #000 !important;
                padding: 0 !important;
                margin: 0 !important;
                font-family: Arial, sans-serif, 'Kosugi Maru';
            }

            .container, #quiz-screen, #result-screen {
                display: none !important;
            }

            .print-only {
                display: block !important;
                width: 100%;
                padding: 5mm 10mm;
                box-sizing: border-box;
            }

            .print-title {
                font-size: 16pt;
                font-weight: bold;
                text-align: center;
                margin-bottom: 20px;
                border-bottom: 2px solid #333;
                padding-bottom: 8px;
            }

            .print-item {
                margin-bottom: 22px;
                page-break-inside: avoid;
            }

            .print-q-header {
                font-size: 11pt;
                font-weight: bold;
                color: #2c3e50;
                margin-bottom: 4px;
            }

            .print-q-body {
                font-size: 11.5pt;
                line-height: 1.4;
                margin-bottom: 8px;
            }

            .worksheet-box {
                margin-top: 6px;
            }

            .worksheet-title {
                font-size: 9.5pt;
                font-weight: bold;
                color: #444;
                margin-bottom: 6px;
            }

            .write-line {
                border-bottom: 1px solid #777;
                height: 28px;
                margin-bottom: 4px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="quiz-screen">
        <h1>英検準2級 面接対策 大問4 #4 (社会問題・意見編)</h1>
        <div class="progress" id="progress">Question 1 / --</div>
        
        <div class="action-buttons">
            <button class="icon-btn" onclick="speakQuestion()" title="質問を聴く">🔊</button>
            <button class="icon-btn" onclick="toggleQuestionText()" title="質問を見る">👁️</button>
        </div>

        <div class="question-text" id="question-display">---</div>

        <div class="stance-container" id="stance-area">
            <button class="stance-btn btn-y" id="btn-agree" onclick="selectStance('yes')">Yes, I do.</button>
            <button class="stance-btn btn-n" id="btn-disagree" onclick="selectStance('no')">No, I don't.</button>
        </div>

        <div class="interviewer-follow" id="follow-text">---</div>

        <button class="nav-btn" id="next-stage-btn" style="display: none;" onclick="showModelAnswers()">NEXT (模範解答を見る) ➔</button>

        <div class="model-answers-section" id="answers-section">
            <div class="model-title">💡 模範解答 (Why / Why not への理由回答)</div>
            
            <div class="answer-block yes-block">
                <div class="block-header" style="color:#27ae60;">🟢 賛成 (Yes / I agree) の解答例</div>
                <div id="yes-answers-list"></div>
            </div>

            <div class="answer-block no-block">
                <div class="block-header" style="color:#c0392b;">🔴 反対 (No / I disagree) の解答例</div>
                <div id="no-answers-list"></div>
            </div>

            <div style="text-align: center;">
                <button class="nav-btn" style="background-color:var(--accent-blue);" onclick="nextQuestion()">次の質問へ進む ➔</button>
            </div>
        </div>

    </div>

    <div class="result-screen" id="result-screen">
        <div class="model-title" style="font-size: 32px;">🎉 特訓完了！ 🎉</div>
        <p style="font-size: 20px; line-height: 1.6;">社会的なテーマに対して理由（2文程度）を<br>ハッキリ答える練習を何度も繰り返しましょう！</p>
        <button class="nav-btn" style="background-color:var(--accent-blue);" onclick="resetQuiz()">もう一度最初から解く</button>
    </div>
</div>

<!-- ワークシート印刷用エリア -->
<div class="print-only" id="print-area">
    <div class="print-title">英検準2級 面接対策 大問4 #4 ワークシート</div>
    <div id="print-content"></div>
</div>

<script>
const quizData = [
    {
        category: "テクノロジー・エネルギー（太陽光発電）",
        q: "Today, a lot of people use solar power to generate electricity for their homes. Do you think more houses will use solar energy in the future?",
        yes: [
            { basic: "Because solar energy is clean and good for the environment. Also, it helps families reduce their electricity bills.", adv: "Because solar power generates clean, renewable energy without pollution. It also lowers long-term household energy expenses.", jp: "【基本】太陽光エネルギーはクリーンで環境に良いからです。また、家族が電気代を削るのに役立ちます。【準2級】太陽光発電は汚染を出さずにクリーンな再生可能エネルギーを生み出すからです。長期的には家庭の光熱費も削減します。" }
        ],
        no: [
            { basic: "Because installing solar panels requires a lot of money. Also, the power output depends on the weather.", adv: "Because initial installation costs for solar equipment remain very high. Power generation is also inconsistent on cloudy days.", jp: "【基本】ソーラーパネルの設置にはたくさんのお金が必要だからです。また、発電量は天候に左右されます。【準2級】太陽光設備の初期設置費用は依然として非常に高額だからです。曇りの日は発電量にムラが出やすくなります。" }
        ]
    },
    {
        category: "教育・国際交流（留学）",
        q: "Many young people want to study abroad in foreign countries. Do you think studying abroad is important for students?",
        yes: [
            { basic: "Because students can improve their language skills faster in foreign countries. Also, they can learn about different cultures and broaden their horizons.", adv: "Because living abroad accelerates language acquisition through immersion. Experiencing diverse cultures also expands students' perspectives.", jp: "【基本】外国では語学力をより早く伸ばすことができるからです。また、異なる文化を学び視野を広げることができます。【準2級】海外生活は没入環境を通じて言語習得を加速させるからです。多様な文化の体験は生徒の視野を大きく広げます。" }
        ],
        no: [
            { basic: "Because studying abroad is very expensive for many families. Also, students can learn foreign languages in Japan using online tools.", adv: "Because international education places a heavy financial burden on families. Digital learning platforms now allow effective language study domestically.", jp: "【基本】留学は多くの家庭にとって非常に費用がかかるからです。また、オンラインツールを使えば日本でも外国語を学べます。【準2級】海外での教育は家族に重い経済的負担をかけるからです。現在はデジタル学習プラットフォームのおかげで国内でも効果的に学べます。" }
        ]
    },
    {
        category: "趣味・社会貢献（ボランティア）",
        q: "Many people enjoy doing volunteer activities in their local communities. Do you think more young people should join volunteer activities?",
        yes: [
            { basic: "Because volunteering helps young people learn useful skills and social responsibility. Also, it is a great way to help people in need.", adv: "Because community service develops practical life skills and empathy. It empowers youth to make meaningful contributions to society.", jp: "【基本】ボランティアは若者が役に立つスキルや社会的責任感を学ぶのに役立つからです。また、困っている人を助ける素晴らしい方法です。【準2級】地域奉仕活動は実践的なスキルと共感力を育むからです。社会に意味のある貢献をする意欲を若者に与えます。" }
        ],
        no: [
            { basic: "Because students are very busy with schoolwork, sports, and exams. Also, they should focus on their studies during their school years.", adv: "Because students already face heavy academic pressure and tight schedules. Prioritizing academic achievements during youth is essential.", jp: "【基本】生徒は学業やスポーツ、試験でとても忙しいからです。また、学生時代は勉強に集中すべきだからです。【準2級】生徒はすでに厳しい学業面でのプレッシャーと忙しいスケジュールに直面しているからです。若い頃は学業の成果を優先することが不可欠です。" }
        ]
    },
    {
        category: "日常生活・週末の過ごし方（自宅で休息）",
        q: "Some people like to spend their weekends resting at home. Do you think it is better to relax at home than to go out on weekends?",
        yes: [
            { basic: "Because resting at home helps people recover from stress and tiredness. Also, they can save money by staying home.", adv: "Because staying home provides peaceful time to recharge physically and mentally. It avoids unnecessary travel expenses as well.", jp: "【基本】家で休むことでストレスや疲労から回復できるからです。また、家にいればお金を節約できます。【準2級】在宅での休養は心身を充電するための静かな時間を提供するからです。不要な交通費や出費も避けられます。" }
        ],
        no: [
            { basic: "Because going out allows people to enjoy hobbies and spend quality time with friends. Also, being outside helps refresh their minds.", adv: "Because outdoor activities provide opportunities for socialization and exercise. Exploring new places offers mental stimulation.", jp: "【基本】外出することで趣味を楽しんだり友人たちと良い時間を過ごしたりできるからです。また、外にいる方が気分転換になります。【準2級】屋外での活動は社交や運動の機会を提供するからです。新しい場所の探索は精神的な刺激を与えてくれます。" }
        ]
    },
    {
        category: "環境・マナー（分別のリサイクル）",
        q: "These days, many trash cans in public places are divided for recycling. Do you think people are paying enough attention to recycling?",
        yes: [
            { basic: "Because many people sort their garbage carefully at home and school. Also, recycling events are held in many towns.", adv: "Because environmental awareness has increased significantly in communities. Proper waste separation has become a standard habit.", jp: "【基本】多くの人が家庭や学校で慎重にゴミを分別しているからです。また、多くの街でリサイクルイベントが開かれています。【準2級】地域社会の中で環境意識が大幅に高まっているからです。適切なゴミの分別が標準的な習慣になっています。" }
        ],
        no: [
            { basic: "Because some people still throw different types of garbage into the same trash bin. Also, more education about recycling is needed.", adv: "Because improper disposal of mixed waste is still frequently observed. Stronger public education campaigns are required.", jp: "【基本】いまだに異なる種類のゴミを同じゴミ箱に捨ててしまう人もいるからです。また、リサイクルに関するさらなる教育が必要です。【準2級】不適切な混合ゴミの廃棄がいまだによく見られるからです。より強力な環境啓発キャンペーンが必要です。" }
        ]
    }
];

let shuffledQuiz = [];
let currentIdx = 0;

function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

function initQuiz() {
    shuffledQuiz = shuffleArray([...quizData]);
    currentIdx = 0;
    loadQuestion();
    renderPrintContent();
}

function renderPrintContent() {
    const printContent = document.getElementById("print-content");
    printContent.innerHTML = "";

    quizData.forEach((item, index) => {
        const itemDiv = document.createElement("div");
        itemDiv.className = "print-item";

        let html = `
        <div class="print-q-header">Q${index + 1}. [${item.category}]</div>
        <div class="print-q-body">${item.q}</div>
        <div class="worksheet-box">
            <div class="worksheet-title">My Answer (自分の意見を書いてみよう)</div>
            <div class="write-line"></div>
            <div class="write-line"></div>
            <div class="write-line"></div>
        </div>`;

        itemDiv.innerHTML = html;
        printContent.appendChild(itemDiv);
    });
}

function loadQuestion() {
    const data = shuffledQuiz[currentIdx];
    document.getElementById("progress").innerText = `Question ${currentIdx + 1} / ${shuffledQuiz.length}`;
    
    const qDisplay = document.getElementById("question-display");
    qDisplay.innerText = data.q;
    qDisplay.style.display = "none";

    const stanceArea = document.getElementById("stance-area");
    stanceArea.style.display = "flex";

    document.getElementById("btn-agree").innerText = "Yes, I do.";
    document.getElementById("btn-disagree").innerText = "No, I don't.";
    
    const followText = document.getElementById("follow-text");
    followText.innerText = "";
    followText.style.display = "none";

    document.getElementById("next-stage-btn").style.display = "none";
    document.getElementById("answers-section").style.display = "none";
}

function speakQuestion() {
    const text = shuffledQuiz[currentIdx].q;
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
    } else {
        alert("お使いのブラウザは音声読み上げに対応していません。");
    }
}

function toggleQuestionText() {
    const qDisplay = document.getElementById("question-display");
    qDisplay.style.display = (qDisplay.style.display === "none") ? "block" : "none";
}

function selectStance(choice) {
    const followText = document.getElementById("follow-text");
    followText.style.display = "block";
    
    if (choice === 'yes') {
        followText.innerText = "🗣️ \"Why?\"";
    } else {
        followText.innerText = "🗣️ \"Why not?\"";
    }

    document.getElementById("stance-area").style.display = "none";
    document.getElementById("next-stage-btn").style.display = "inline-block";
}

function showModelAnswers() {
    const data = shuffledQuiz[currentIdx];
    document.getElementById("next-stage-btn").style.display = "none";
    
    const listYes = document.getElementById("yes-answers-list");
    const listNo = document.getElementById("no-answers-list");
    
    listYes.innerHTML = "";
    listNo.innerHTML = "";

    data.yes.forEach((item) => {
        const div = document.createElement("div");
        div.className = "answer-item";
        div.innerHTML = `
            <div class="step-label">🟢 基本表現 (3級・確実):</div> ${item.basic}<br>
            <div class="step-label" style="color:#2980b9;">🔵 準2級表現 (語彙強化):</div> ${item.adv}
            <div class="jp-sub">${item.jp}</div>
        `;
        listYes.appendChild(div);
    });

    data.no.forEach((item) => {
        const div = document.createElement("div");
        div.className = "answer-item";
        div.innerHTML = `
            <div class="step-label">🔴 基本表現 (3級・確実):</div> ${item.basic}<br>
            <div class="step-label" style="color:#2980b9;">🔵 準2級表現 (語彙強化):</div> ${item.adv}
            <div class="jp-sub">${item.jp}</div>
        `;
        listNo.appendChild(div);
    });

    document.getElementById("answers-section").style.display = "block";
}

function nextQuestion() {
    currentIdx++;
    if (currentIdx < shuffledQuiz.length) {
        loadQuestion();
    } else {
        document.getElementById("quiz-screen").style.display = "none";
        document.getElementById("result-screen").style.display = "block";
    }
}

function resetQuiz() {
    document.getElementById("quiz-screen").style.display = "block";
    document.getElementById("result-screen").style.display = "none";
    initQuiz();
}

initQuiz();
</script>

</body>
</html>
