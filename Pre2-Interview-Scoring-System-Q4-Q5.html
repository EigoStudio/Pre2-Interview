<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英検準2級 面接採点システム - EIKEN Evaluator</title>
    <style>
        :root {
            --primary-navy: #0F2537;
            --secondary-navy: #1C3B57;
            --accent-gold: #C5A059;
            --light-gold: #F4EAD3;
            --border-color: #CBD5E1;
            --bg-light: #F8FAFC;
            --text-dark: #1E293B;
            --success-green: #15803D;
            --warning-amber: #B45309;
        }

        body {
            font-family: 'Times New Roman', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
            background-color: #E2E8F0;
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: #FFFFFF;
            border: 2px solid var(--primary-navy);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            padding: 40px;
            box-sizing: border-box;
            position: relative;
        }

        .header {
            text-align: center;
            border-bottom: 3px double var(--primary-navy);
            padding-bottom: 20px;
            margin-bottom: 30px;
            position: relative;
        }

        .header h1 {
            font-size: 26px;
            color: var(--primary-navy);
            margin: 0 0 5px 0;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .header .subtitle {
            font-size: 14px;
            color: #64748B;
            font-family: sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stamp-mark {
            position: absolute;
            top: 0;
            right: 10px;
            width: 70px;
            height: 70px;
            border: 2px solid #B91C1C;
            border-radius: 50%;
            color: #B91C1C;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            transform: rotate(-12deg);
            opacity: 0.85;
            font-family: sans-serif;
            text-align: center;
            line-height: 1.2;
        }

        .section-title {
            background-color: var(--primary-navy);
            color: #FFFFFF;
            padding: 8px 15px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 30px;
            margin-bottom: 20px;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .api-config {
            background: var(--bg-light);
            border: 1px solid var(--border-color);
            padding: 10px 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: sans-serif;
            font-size: 13px;
        }

        .api-config input {
            flex: 1;
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            border-radius: 3px;
            font-size: 13px;
        }

        .upload-zone {
            border: 2px dashed var(--accent-gold);
            background-color: var(--light-gold);
            padding: 35px;
            text-align: center;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.2s;
            font-family: sans-serif;
            margin-bottom: 25px;
        }

        .upload-zone:hover {
            background-color: #EFE3C3;
        }

        .upload-zone p {
            margin: 5px 0;
            color: var(--primary-navy);
        }

        #file-input { display: none; }

        #loading-indicator {
            display: none;
            text-align: center;
            margin: 20px 0;
            font-family: sans-serif;
            font-weight: bold;
            color: var(--primary-navy);
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--accent-gold);
            border-radius: 50%;
            width: 35px;
            height: 35px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #result-section {
            display: none;
            margin-top: 30px;
            border-top: 2px solid var(--primary-navy);
            padding-top: 20px;
        }

        .score-summary-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
            text-align: center;
        }

        .score-summary-table th, .score-summary-table td {
            border: 1px solid var(--primary-navy);
            padding: 10px;
        }

        .score-summary-table th {
            background-color: var(--primary-navy);
            color: #FFFFFF;
            font-size: 14px;
        }

        .total-score-box {
            font-size: 28px;
            font-weight: bold;
            color: var(--primary-navy);
        }

        .eval-card {
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
            padding: 15px 20px;
            background: #FFFFFF;
        }

        .eval-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .eval-q-title {
            font-weight: bold;
            color: var(--primary-navy);
            font-size: 15px;
        }

        .eval-score {
            font-size: 18px;
            font-weight: bold;
            color: var(--primary-navy);
            background: var(--light-gold);
            padding: 3px 12px;
            border: 1px solid var(--accent-gold);
        }

        .eval-point-list {
            margin: 5px 0 10px 20px;
            padding: 0;
            font-size: 14px;
        }

        .eval-point-list.good li { color: var(--success-green); }
        .eval-point-list.fix li { color: var(--warning-amber); }

        .brushup-box {
            background-color: #F1F5F9;
            border-left: 3px solid var(--accent-gold);
            padding: 10px 15px;
            font-style: italic;
            margin-top: 10px;
            font-size: 14px;
        }

        .print-btn {
            background: #64748B;
            color: white;
            border: none;
            padding: 8px 20px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 20px;
            font-family: sans-serif;
        }

        @media print {
            body { background: white; padding: 0; }
            .container { border: none; box-shadow: none; width: 100%; max-width: 100%; }
            .upload-zone, .api-config, .print-btn { display: none; }
            #result-section { display: block !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="stamp-mark">EIKEN<br>OFFICIAL<br>EVAL</div>
    
    <div class="header">
        <h1>英検準2級 面接試験 評価証明書</h1>
        <div class="subtitle">Official Grade Pre-2 Speaking Assessment Report</div>
    </div>

    <!-- API Key Input -->
    <div class="api-config">
        <label for="api-key">🔑 Gemini API Key:</label>
        <input type="password" id="api-key" placeholder="APIキーを入力" onchange="saveApiKey()">
    </div>

    <!-- Upload Area -->
    <div class="upload-zone" onclick="document.getElementById('file-input').click();">
        <p style="font-size: 18px;"><strong>📷 ワークシートの画像をここにドロップ / 添付</strong></p>
        <p style="font-size: 13px; color: #64748B;">クリックして画像ファイルを選択してください</p>
        <input type="file" id="file-input" accept="image/*" onchange="processImage(event)">
    </div>

    <!-- Loading Spinner -->
    <div id="loading-indicator">
        <div class="spinner"></div>
        <p>AIが手書き画像を解析中... 採点完了まで少々お待ちください</p>
    </div>

    <!-- Results Section -->
    <div id="result-section">
        <div class="section-title">採点結果・評価サマリー</div>

        <table class="score-summary-table">
            <thead>
                <tr>
                    <th>Q1</th>
                    <th>Q2</th>
                    <th>Q3</th>
                    <th>Q4</th>
                    <th>Q5</th>
                    <th>総合得点</th>
                    <th>判定</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td id="score-q1">-</td>
                    <td id="score-q2">-</td>
                    <td id="score-q3">-</td>
                    <td id="score-q4">-</td>
                    <td id="score-q5">-</td>
                    <td id="score-total" class="total-score-box">- / 25</td>
                    <td id="score-grade" style="font-weight: bold; color: var(--primary-navy);">-</td>
                </tr>
            </tbody>
        </table>

        <div class="section-title">問題別 詳細添削・診断メッセージ</div>

        <div id="eval-details-container"></div>

        <div style="text-align: center;">
            <button class="print-btn" onclick="window.print()">成績証明書を印刷 / PDF保存</button>
        </div>
    </div>
</div>

<script>
    window.onload = function() {
        const savedKey = localStorage.getItem('gemini_api_key');
        if (savedKey) {
            document.getElementById('api-key').value = savedKey;
        }
    };

    function saveApiKey() {
        const key = document.getElementById('api-key').value.trim();
        localStorage.setItem('gemini_api_key', key);
    }

    async function processImage(event) {
        const file = event.target.files[0];
        if (!file) return;

        const apiKey = document.getElementById('api-key').value.trim();
        if (!apiKey) {
            alert('APIキーが入力されていません。上部のボックスに入力してください。');
            return;
        }

        document.getElementById('loading-indicator').style.display = 'block';
        document.getElementById('result-section').style.display = 'none';

        try {
            const base64Data = await fileToBase64(file);

            const promptText = `
You are an EIKEN Grade Pre-2 Speaking Test examiner. Read the provided worksheet image (5 questions and handwritten student answers).
Evaluate each answer on a 5-point scale according to EIKEN criteria.
Return ONLY a JSON object (no markdown, no extra text):
{
  "scores": [5, 5, 4, 5, 5],
  "details": [
    {
      "question": "Question text...",
      "answer": "Transcribed answer...",
      "score": 5,
      "goods": ["Good point 1"],
      "fixes": ["Fix point 1"],
      "brushup": "Model answer..."
    }
  ]
}`;

            // Try primary endpoint (gemini-2.5-flash), fallback to gemini-2.0-flash
            const models = ['gemini-2.5-flash', 'gemini-2.0-flash'];
            let resData = null;
            let lastError = null;

            for (const model of models) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [
                                    { text: promptText },
                                    { inline_data: { mime_type: file.type, data: base64Data } }
                                ]
                            }]
                        })
                    });

                    const json = await response.json();
                    if (!json.error) {
                        resData = json;
                        break;
                    } else {
                        lastError = json.error.message;
                    }
                } catch (e) {
                    lastError = e.message;
                }
            }

            if (!resData) {
                throw new Error(lastError || 'API通信エラーが発生しました');
            }

            let textResponse = resData.candidates[0].content.parts[0].text;
            textResponse = textResponse.replace(/```json/gi, '').replace(/```/g, '').trim();
            const evalData = JSON.parse(textResponse);

            renderReport(evalData);

        } catch (error) {
            alert('解析中にエラーが発生しました:\n' + error.message + '\n\n※APIキーが正しくコピーされているかご確認ください。');
        } finally {
            document.getElementById('loading-indicator').style.display = 'none';
        }
    }

    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
        });
    }

    function renderReport(data) {
        document.getElementById('score-q1').innerText = data.scores[0] + ' / 5';
        document.getElementById('score-q2').innerText = data.scores[1] + ' / 5';
        document.getElementById('score-q3').innerText = data.scores[2] + ' / 5';
        document.getElementById('score-q4').innerText = data.scores[3] + ' / 5';
        document.getElementById('score-q5').innerText = data.scores[4] + ' / 5';

        const total = data.scores.reduce((a, b) => a + b, 0);
        document.getElementById('score-total').innerText = total + ' / 25';
        document.getElementById('score-grade').innerText = total >= 20 ? '合格圏内 (PASSED)' : '要トレーニング';

        const container = document.getElementById('eval-details-container');
        container.innerHTML = '';

        data.details.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'eval-card';
            card.innerHTML = `
                <div class="eval-header">
                    <span class="eval-q-title">Q${index + 1}. ${item.question}</span>
                    <span class="eval-score">評価: ${item.score} / 5</span>
                </div>
                <div style="font-size: 13px; color: #64748B; margin-bottom: 8px;"><strong>【読み取った回答】:</strong> ${item.answer}</div>
                <div style="font-weight: bold; font-size: 13px; color: var(--success-green);">【評価された点】</div>
                <ul class="eval-point-list good">
                    ${item.goods.map(g => `<li>${g}</li>`).join('')}
                </ul>
                <div style="font-weight: bold; font-size: 13px; color: var(--warning-amber);">【改善・指導アドバイス】</div>
                <ul class="eval-point-list fix">
                    ${item.fixes.map(f => `<li>${f}</li>`).join('')}
                </ul>
                <div class="brushup-box">
                    <strong>✨ Brush Up (模範解答):</strong><br>
                    "${item.brushup}"
                </div>
            `;
            container.appendChild(card);
        });

        document.getElementById('result-section').style.display = 'block';
        document.getElementById('result-section').scrollIntoView({ behavior: 'smooth' });
    }
</script>

</body>
</html>
